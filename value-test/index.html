<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>빵집에서 고르는 나의 간식 (시험판)</title>
<style>
  :root {
    --bg: #fbf5ec;
    --card: #ffffff;
    --ink: #3b2a1e;
    --soft: #8a7564;
    --faint: #b9a896;
    --line: #e6d7c4;
    --accent: #c9773b;
    --accent-ink: #ffffff;
    --pick: #fff1e2;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 19px;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: anywhere;
    overflow-x: hidden;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 48px;
    min-height: 100vh;
    min-height: 100dvh;
  }
  h1 { font-size: 28px; line-height: 1.35; margin: 8px 0 4px; }
  h2 { font-size: 23px; line-height: 1.45; margin: 4px 0 20px; }
  p { margin: 0 0 14px; }
  .badge {
    display: inline-block; font-size: 14px; padding: 2px 10px; border-radius: 999px;
    background: var(--line); color: var(--ink); vertical-align: middle;
  }
  .hero { font-size: 44px; text-align: center; margin: 20px 0 8px; }
  .small { font-size: 16px; color: var(--soft); }
  .tiny { font-size: 14px; color: var(--soft); line-height: 1.5; }
  label.field { display: block; font-weight: 600; margin: 22px 0 6px; }
  label.field span { font-weight: 400; color: var(--soft); font-size: 15px; }
  input[type=text], textarea {
    width: 100%; font: inherit; font-size: 18px; color: var(--ink);
    padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--card);
  }
  textarea { min-height: 96px; resize: vertical; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .primary {
    display: block; width: 100%; margin-top: 20px; padding: 15px 16px;
    border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
    font-size: 20px; font-weight: 700;
  }
  .primary:disabled { opacity: .35; }
  .ghost {
    padding: 13px 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--card);
    font-size: 18px;
  }

  /* 진행 표시 */
  .bags { font-size: 20px; letter-spacing: 1px; min-height: 32px; margin-bottom: 14px; }

  /* 보기 공통 */
  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    width: 100%; text-align: left; padding: 15px 16px; min-height: 58px;
    border: 2px solid var(--line); border-radius: 14px; background: var(--card); font-size: 19px; line-height: 1.5;
  }
  .opt.on { border-color: var(--accent); background: var(--pick); box-shadow: 0 0 0 2px var(--accent) inset; }

  /* 책 표지 카드 */
  .opts.book, .opts.frame { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .opts.book .opt, .opts.frame .opt { width: calc(50% - 6px); }
  .opts.book .opt {
    min-height: 190px; display: flex; flex-direction: column; justify-content: center; text-align: center;
    padding: 18px 14px 18px 22px; border-radius: 4px 12px 12px 4px; font-weight: 700; font-size: 18px;
    background: linear-gradient(90deg, rgba(0,0,0,.10) 0 8px, transparent 8px), var(--cv, #f3e3cf);
    border-color: transparent;
  }
  .opts.book .opt.on { border-color: var(--accent); }
  .opts.book .opt .by { display: block; font-weight: 400; font-size: 13px; color: var(--soft); margin-top: 12px; }

  /* 액자 카드 */
  .opts.frame .opt {
    text-align: center; padding: 12px 12px 14px; border-radius: 6px; border: 2px solid var(--line);
    box-shadow: 0 2px 6px rgba(60,40,20,.08);
  }
  .opts.frame .opt .pic {
    display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1;
    font-size: 46px; border-radius: 3px; background: var(--cv, #f3e3cf); margin-bottom: 10px;
  }
  .opts.frame .opt .cap { display: block; font-size: 16px; line-height: 1.45; }
  .opts.frame .opt.on { border-color: var(--accent); }

  /* 썸네일 카드 */
  .opts.thumb .opt { padding: 10px 10px 14px; }
  .opts.thumb .opt .tb {
    position: relative; display: flex; align-items: center; justify-content: center;
    aspect-ratio: 16 / 7; border-radius: 10px; background: var(--cv, #f3e3cf); margin-bottom: 10px;
  }
  .opts.thumb .opt .tb::after {
    content: ""; width: 0; height: 0; border-left: 20px solid rgba(255,255,255,.95);
    border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 6px;
  }
  .opts.thumb .opt .tb .dur {
    position: absolute; right: 8px; bottom: 6px; font-size: 12px; color: #fff;
    background: rgba(0,0,0,.55); padding: 0 6px; border-radius: 4px;
  }
  .opts.thumb .opt .tt { display: block; font-weight: 600; padding: 0 4px; }

  .hard { display: flex; align-items: center; gap: 8px; margin: 18px 0 0; font-size: 15px; color: var(--soft); }
  .hard input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  .nav { display: flex; gap: 10px; margin-top: 22px; }
  .nav .ghost { flex: 0 0 auto; }
  .nav .primary { margin-top: 0; flex: 1; }

  .examples { margin: 0 0 10px; padding: 0; list-style: none; color: var(--faint); font-size: 16px; }
  .examples li::before { content: "예) "; }

  /* 계산 중 */
  .calc { text-align: center; padding-top: 30vh; font-size: 24px; font-weight: 700; }
  .calc .roll { display: inline-block; animation: wob .6s ease-in-out infinite alternate; }
  @keyframes wob { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }

  /* 영수증 */
  .receipt {
    background: var(--card); border: 2px dashed var(--faint); border-radius: 6px;
    padding: 20px 16px; margin: 8px 0 14px;
  }
  .rc-head { text-align: center; font-size: 22px; font-weight: 800; }
  .rc-sub { text-align: center; font-size: 14px; color: var(--soft); margin-top: 2px; }
  .rc-cut { border-top: 2px dashed var(--line); margin: 16px 0; }
  .rc-label { font-size: 14px; color: var(--soft); font-weight: 700; margin-bottom: 8px; }
  .rc-set { text-align: center; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
  .mains { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .main { flex: 1 1 140px; text-align: center; }
  .main .em { font-size: 60px; line-height: 1.2; }
  .main .nm { font-size: 21px; font-weight: 800; }
  .main .ln { font-size: 16px; color: var(--soft); margin-top: 4px; }
  .mains.many .main .em { font-size: 44px; }
  .mains.many .main .nm { font-size: 17px; }
  .mains.many .main .ln { font-size: 14px; }
  .rel { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; }
  .rel .em { font-size: 24px; flex: none; }
  .rel .nm { font-weight: 700; }
  .rel-for { font-size: 14px; color: var(--soft); margin: 10px 0 4px; }
  .note { font-size: 14px; color: var(--soft); margin-top: 2px; }
  .rc-total { display: flex; justify-content: space-between; font-weight: 800; }

  /* 해설 */
  .card { background: var(--card); border-radius: 18px; padding: 22px 18px; margin: 12px 0 16px; box-shadow: 0 2px 10px rgba(60,40,20,.07); }
  .card-top { text-align: center; margin-bottom: 16px; }
  .card-top .em { font-size: 64px; line-height: 1.2; }
  .card-top .nm { font-size: 24px; font-weight: 800; }
  .card-top .ln { font-size: 17px; color: var(--accent); font-weight: 700; margin-top: 4px; }
  .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
  .tags span { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--pick); color: var(--ink); }
  .card h4 { font-size: 17px; margin: 18px 0 6px; }
  .card p, .card li { font-size: 17px; }
  .card ul { margin: 0; padding-left: 20px; }
  .card li { margin-bottom: 4px; }
  .pair2 { display: flex; gap: 10px; margin-top: 18px; }
  .pair2 > div { flex: 1; text-align: center; padding: 12px 8px; border: 2px dashed var(--line); border-radius: 12px; }
  .pair2 b { display: block; font-size: 14px; color: var(--accent); }
  .pair2 span { display: block; font-size: 16px; line-height: 1.45; margin-top: 2px; }
  .rel-card { background: var(--card); border-radius: 14px; padding: 16px; margin: 10px 0; }
  .rel-card .rel-h { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .rel-card .rel-h .em { font-size: 40px; flex: none; }
  .rel-card .nm { font-weight: 800; font-size: 18px; }
  .rel-card .ln { font-size: 14px; color: var(--soft); line-height: 1.45; }
  .rel-card p { font-size: 16px; margin: 6px 0 0; }
  .rel-card .learn { background: var(--pick); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .rel-card .learn b { display: block; font-size: 14px; color: var(--accent); }
  .about p { font-size: 16px; color: var(--soft); }

  /* 피드백 */
  .section { margin-top: 30px; }
  .section h3 { font-size: 20px; margin: 0 0 6px; }
  .q { font-weight: 600; margin: 20px 0 8px; }
  .q span { font-weight: 400; color: var(--soft); font-size: 14px; }
  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; padding: 12px 0; border: 2px solid var(--line); border-radius: 12px; background: var(--card); font-size: 18px;
  }
  .seg button.on { border-color: var(--accent); background: var(--pick); font-weight: 700; }
  .seg-cap { display: flex; justify-content: space-between; font-size: 13px; color: var(--soft); margin-top: 4px; }
  #codeBox { font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.5; min-height: 200px; margin-top: 12px; background: #fffdf9; }
  .status { font-size: 16px; font-weight: 600; margin-top: 10px; min-height: 1em; }
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";

/* ===== 데이터 ===== */

// 원 위 순서 (바로 옆끼리 닮은꼴, UN 다음은 다시 SD)
const SNACKS = [
  { c: "SD", n: "자율주행 베이글", e: "🥯", l: "동그란 바퀴 모양 그대로, 누가 밀지 않아도 내 멋대로 굴러가요" },
  { c: "ST", n: "톡톡 튀는 팝핑캔디", e: "🍬", l: "심심한 건 못 참아, 일단 터뜨려 보자" },

  { c: "AC", n: "끝판왕 크루아상", e: "🥐", l: "할 거면 제대로, 깰 거면 끝판까지" },
  { c: "PO", n: "보스 등판 홀케이크", e: "🎂", l: "판이 어지러우면 내가 정리한다" },
  { c: "SE", n: "유비무환 식빵", e: "🍞", l: "괜찮아, 내가 미리 준비해 뒀거든" },
  { c: "CO", n: "칼각 마들렌", e: "🧁", l: "선 지키는 게 제일 멋있어" },

  { c: "BE", n: "내 사람 한정 꿀호떡", e: "🥞", l: "내 사람이 행복하면 그걸로 됐어" },
  { c: "UN", n: "세계평화 비건 쿠키", e: "🍪", l: "모두에게 괜찮은 세상이 내가 바라는 세상" },
];
const CIRCLE = SNACKS.map(s => s.c);
const SNACK = Object.fromEntries(SNACKS.map(s => [s.c, s]));
const OPPOSITE = { SD: "CO", CO: "SD", ST: "SE", SE: "ST", HE: "TR", TR: "HE", AC: "BE", BE: "AC", PO: "UN", UN: "PO" };

// 간식별 해설 (결과 화면에서만 사용)

    power: "남들이 안 해 본 방법을 떠올리고, 혼자서도 끝까지 굴러가는 힘이 있어요. 새 판을 짜야 할 때 제일 먼저 빛나요.",
    shadow: "간섭이 느껴지면 확 식어 버리거나, 도움 요청을 자꾸 미루기도 해요. 혼자 굴러가는 것과 혼자 버티는 건 달라요.",

/* ===== 채점 (화면과 분리된 순수 함수) ===== */

function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 1단계: 고른 보기의 방향을 센다
function countDirs(dirs) {
  const n = { E: 0, A: 0, S: 0, B: 0 };
  dirs.forEach(d => { n[d]++; });
  return n;
}

// 2단계 세트 정하기
function chooseSet(counts, rng) {
  rng = rng || Math.random;
  const top = Math.max(...DIRS.map(d => counts[d]));
  const tied = DIRS.filter(d => counts[d] === top);
  if (tied.length >= 3) {
    const pick = shuffle(tied, rng);
    return { mode: "random", first: pick[0], second: pick[1], tied };
  }
  // 동점은 무작위 순서로 (섞은 뒤 안정 정렬)
  const sorted = shuffle(DIRS, rng).sort((a, b) => counts[b] - counts[a]);
  const first = sorted[0], second = sorted[1];
  if (counts[first] - counts[second] >= 2) return { mode: "single", first, second: null };
  return { mode: "mixed", first, second, tie: counts[first] === counts[second] };
}

// 섞은 세트 = 1위 세트의 7·9·11번 + 2위 세트의 8·10·12번 (7→12 순서)
function buildStage2(info) {
  if (info.mode === "single") return SETS[info.first].slice();
  return SETS[info.first].map((q, i) => (i % 2 === 0 ? q : SETS[info.second][i]));
}

// 2단계 간식 점수 → 겉 캐릭터
function snackResult(codes) {
  const n = {};
  codes.forEach(c => { n[c] = (n[c] || 0) + 1; });
  const max = Math.max(0, ...Object.values(n));
  const tops = CIRCLE.filter(c => n[c] === max && max > 0);
  const type = tops.length === 1 ? "single" : tops.length === 2 ? "half" : "mix";
  return { counts: n, tops, type };
}

function neighbors(code) {
  const i = CIRCLE.indexOf(code);
  return [CIRCLE[(i + 9) % 10], CIRCLE[(i + 1) % 10]];
}
function opposite(code) { return OPPOSITE[code]; }

// 1단계 답이 바뀌어 방향 점수가 달라졌을 때만 세트를 새로 정한다
function prepareStage2() {
  const counts = countDirs(S.picks.slice(0, 6).map(p => p.d));
  const key = DIRS.map(d => counts[d]).join(",");
  if (key === S.setKey && S.setInfo) return;
  const info = chooseSet(counts);
  const stage2 = buildStage2(info);
  const same = S.stage2.length && stage2.every((q, k) => q === S.stage2[k]);
  S.setKey = key;
  S.setInfo = info;
  S.counts = counts;
  if (!same) {
    S.stage2 = stage2;
    for (let k = 6; k < 12; k++) { S.picks[k] = undefined; S.orders[k] = undefined; S.hard[k] = false; S.times[k] = 0; }
  }
}

    const wrap = document.getElementById(id);
    wrap.querySelectorAll("button").forEach(b => {
      b.onclick = () => {
        const v = id === "fit" ? +b.dataset.v : b.dataset.v;
        S.fb[id] = S.fb[id] === v ? null : v;
        wrap.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b && S.fb[id] !== null));
        refresh();
      };
    });
  });
  document.getElementById("odd").oninput = e => { S.fb.odd = e.target.value; refresh(); };
  document.getElementById("copy").onclick = () => copyCode(box);
  refresh();
}

/* ===== 결과 코드 ===== */

function pad(n) { return String(n).padStart(2, "0"); }
function fmtDate(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function sec(ms) { return (Math.round((ms || 0) / 100) / 10).toFixed(1); }

function setLabel(info) {
  const f = DIR_EMOJI[info.first], s = info.second && DIR_EMOJI[info.second];
  if (info.mode === "single") return `단일 (${f})`;
  if (info.mode === "random") return `무작위 (${info.tied.map(d => DIR_EMOJI[d]).join("·")} 동점 → ${f} 7·9·11 + ${s} 8·10·12)`;
  return `섞음 (${f} 7·9·11 + ${s} 8·10·12${info.tie ? ", 1·2위 동점이라 순서는 무작위" : ""})`;
}

function buildCode() {
  const r = S.result, c = S.counts;
  const shown = CIRCLE.filter(code => S.stage2.some(q => q.o.some(op => op.c === code)));
  const outer = r.tops.map(code => `${code} ${SNACK[code].n}`).join(" + ");
  const typeName = r.type === "half" ? "반반 세트: " : r.type === "mix" ? "모둠 세트: " : "";
  const lines = [
    "[간식 가치관 테스트 · 시험판 결과 코드]",
    `별명: ${S.nick || "(없음)"}`,
    `일시: ${fmtDate(new Date(S.startAt))}`,
    `총 걸린 시간: ${Math.round((S.endAt - S.startAt) / 1000)}초`,
    `1단계 방향 점수: ${DIRS.map(d => DIR_EMOJI[d] + c[d]).join(" ")}`,
    `2단계 세트: ${setLabel(S.setInfo)}`,
    `2단계 간식 점수: ${shown.map(code => code + (r.counts[code] || 0)).join(" ")}`,
    `겉 캐릭터: ${typeName}${outer}`,
    "",
    "[문항] 번호. 상황 | 고른 보기 [코드] | 머문 시간 | 어려웠어요",
  ];
  for (let i = 0; i < 12; i++) {
    const q = questionAt(i), p = S.picks[i];
    const code = i < 6 ? DIR_EMOJI[p.d] + p.c : p.c;
    lines.push(`${i + 1}. ${q.t} | ${p.x} [${code}] | ${sec(S.times[i])}초 | ${S.hard[i] ? "✔" : "-"}`);
  }
  lines.push(
    "",
    "[속 재료 주문서]",
    `마음에 걸리는 것: ${S.sheet1.trim() || "(건너뜀)"}`,
    `솔직한 이유: ${S.sheet2.trim() || "(건너뜀)"}`,
    "",
    "[피드백]",
    `얼마나 맞아요(1~5): ${S.fb.fit ?? "(무응답)"}`,
    `스토리에 올리고 싶어요: ${S.fb.story ?? "(무응답)"}`,
    `이상하거나 어색했던 점: ${S.fb.odd.trim() || "(무응답)"}`,
  );
  return lines.join("\n");
}

function legacyCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:-9999px;font-size:12pt;opacity:0;";
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

function copyCode(box) {
  const text = buildCode();
  box.value = text;
  const status = document.getElementById("status");
  const done = () => { status.textContent = "복사됐어요! 카톡 창에 붙여 넣어 주세요 ✅"; };
  const fail = () => {
    status.textContent = "자동 복사가 안 됐어요. 아래 상자를 길게 눌러 복사해 주세요.";
    box.focus();
    box.setSelectionRange(0, text.length);
    box.scrollIntoView({ block: "center" });
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => (legacyCopy(text) ? done() : fail()));
  } else {
    legacyCopy(text) ? done() : fail();
  }
}

if (app) renderStart();
</script>
